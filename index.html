<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俳句道場 - AIと詠む一句</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700&family=Yomogi&display=swap" rel="stylesheet">
<style>
  :root {
    --washi: #f6f1e6;
    --washi-dark: #ece3d0;
    --ink: #263544;
    --indigo: #223a5e;
    --indigo-light: #375581;
    --vermillion: #c0392b;
    --gold: #b8860b;
    --card-bg: #fffdf8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--washi);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(34,58,94,0.05) 0, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(192,57,43,0.05) 0, transparent 40%);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Shippori Mincho', serif; }
  #app { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }
  header.top { text-align: center; margin-bottom: 20px; }
  header.top h1 {
    font-family: 'Shippori Mincho', serif; font-weight: 800;
    font-size: 1.9rem; color: var(--indigo); margin: 0 0 4px;
    letter-spacing: 0.05em;
  }
  header.top p { color: #6b7280; font-size: 0.85rem; margin: 0; }

  .panel {
    background: var(--card-bg);
    border: 1px solid #e4dcc8;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 10px rgba(38,53,68,0.06);
  }
  .settings summary {
    cursor: pointer; font-size: 0.85rem; color: var(--indigo-light);
    font-weight: 500; outline: none;
  }
  .settings[open] summary { margin-bottom: 12px; }
  label.field-label { display:block; font-size: 0.78rem; color:#6b7280; margin-bottom:4px; font-weight:500;}
  input[type=text], input[type=password], textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #d8cfb8; background: #fffef9;
    font-family: inherit; font-size: 0.95rem; color: var(--ink);
    resize: vertical;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--indigo-light); outline-offset: 1px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width: 140px; }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding: 11px 18px; border-radius: 999px; border: none;
    font-weight: 700; font-size: 0.92rem; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--indigo); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--indigo-light); }
  .btn-accent { background: var(--vermillion); color: #fff; }
  .btn-accent:hover:not(:disabled) { background: #d9534f; }
  .btn-ghost { background: transparent; color: var(--indigo); border: 1px solid var(--indigo); }
  .btn-ghost:hover:not(:disabled) { background: rgba(34,58,94,0.06); }
  .btn-block { width: 100%; }

  .mode-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px) { .mode-grid { grid-template-columns: 1fr; } }
  .mode-card {
    background: var(--card-bg); border: 1px solid #e4dcc8; border-radius: 16px;
    padding: 22px 18px; text-align: center; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .mode-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(38,53,68,0.12); }
  .mode-card .icon { font-size: 2.2rem; margin-bottom: 8px; }
  .mode-card h3 { font-family:'Shippori Mincho',serif; margin: 0 0 6px; color: var(--indigo); font-size:1.1rem; }
  .mode-card p { font-size: 0.82rem; color:#6b7280; margin:0; line-height:1.5; }

  .haiku-display {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.5rem; font-weight: 600; color: var(--indigo);
    white-space: pre-line; text-align: center; line-height: 2.1;
    padding: 20px 10px; background: linear-gradient(180deg, #fffef9, #f9f4e7);
    border-radius: 10px; border: 1px dashed #cbbf9e; margin-bottom: 14px;
  }

  .score-wrap { display:flex; align-items:center; gap: 14px; margin-bottom: 10px; }
  .score-num { font-family:'Shippori Mincho',serif; font-size: 2.4rem; font-weight: 800; color: var(--vermillion); line-height:1; }
  .score-num small { font-size: 1rem; color:#6b7280; font-weight:500; }
  .score-bar-bg { flex:1; height: 10px; background:#e9e2cf; border-radius: 999px; overflow:hidden; }
  .score-bar-fill { height:100%; background: linear-gradient(90deg, var(--gold), var(--vermillion)); border-radius:999px; transition: width .5s ease; }

  .comment-row { display:flex; gap:8px; font-size: 0.88rem; margin-bottom: 6px; align-items:flex-start; }
  .comment-row .tag {
    flex-shrink:0; font-size: 0.72rem; font-weight:700; padding: 2px 8px; border-radius: 999px;
    color:#fff;
  }
  .tag.good { background: #2e7d32; }
  .tag.tip { background: var(--indigo-light); }

  .hint-box { background: #eef2f7; border-left: 4px solid var(--indigo-light); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
  .hint-box .row-item { font-size: 0.88rem; margin-bottom: 6px; }
  .hint-box .row-item b { color: var(--indigo); }

  .card-draw {
    background: linear-gradient(135deg, #fff9ec, #fdeed1);
    border: 2px solid var(--gold); border-radius: 14px;
    padding: 18px; text-align:center; margin-bottom: 14px;
  }
  .card-draw .icon { font-size: 2rem; }
  .card-draw h4 { font-family:'Shippori Mincho',serif; color:#7a5b0a; margin: 6px 0 4px; font-size:1.05rem; }
  .card-draw p { font-size: 0.85rem; color:#5c4a1e; margin:0; }

  .choitashi-logo {
    text-align: center; padding: 14px 10px 10px; margin-bottom: 12px;
    background: #fffdf8; border: 1px solid #e4dcc8; border-radius: 14px;
  }
  .ct-word {
    font-family: 'Yomogi', cursive; font-weight: 400; line-height: 1.05;
    background-clip: text; -webkit-background-clip: text; color: transparent;
    -webkit-text-stroke: 1.6px var(--ct-outline); paint-order: stroke fill;
    display: inline-block; transform: rotate(var(--ct-tilt, 0deg));
  }
  .ct-word.ct-main {
    --ct-outline: #2f9fe0; --ct-tilt: -1.5deg;
    font-size: 3rem;
    background-image: repeating-linear-gradient(45deg, #f5a742 0 7px, #fce3bd 7px 14px);
  }
  .ct-line2 { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:2px; }
  .ct-word.ct-sub {
    --ct-outline: #1c2b5e; --ct-tilt: 1deg;
    font-size: 2.5rem;
    background-image: repeating-linear-gradient(45deg, #ef5da8 0 6px, #fbd6e8 6px 12px);
  }
  .ct-doodles { font-size: 1.7rem; line-height:1; transform: rotate(-4deg); }
  .ct-credit { font-family: 'Yomogi', cursive; font-size: 0.78rem; color: #6b6355; text-align: right; margin-top: 6px; padding-right: 4px; }
  .ct-list-link { display:inline-block; font-size: 0.8rem; color: var(--indigo-light); text-decoration: none; margin-top: 8px; }
  .ct-list-link:hover { text-decoration: underline; }

  .history-item { border-top: 1px solid #ece3d0; padding: 12px 0; }
  .history-item:first-child { border-top:none; }
  .history-head { display:flex; justify-content:space-between; align-items:center; font-size:0.8rem; color:#6b7280; margin-bottom:4px;}
  .history-haiku { font-family:'Shippori Mincho',serif; font-size:1.05rem; white-space:pre-line; color:var(--ink); margin-bottom:4px; }
  .delta { font-weight:700; padding:1px 8px; border-radius:999px; font-size:0.78rem; }
  .delta.up { background:#e3f4e6; color:#2e7d32; }
  .delta.down { background:#fdeaea; color:#b3261e; }
  .delta.flat { background:#eee; color:#6b7280; }

  .error-box { background:#fdeaea; border:1px solid #f2b8b5; color:#b3261e; padding:10px 14px; border-radius:8px; font-size:0.85rem; margin-bottom:14px; }
  .loading { text-align:center; padding: 24px; color:#6b7280; font-size:0.9rem; }
  .spinner {
    width:26px; height:26px; margin:0 auto 10px; border-radius:50%;
    border: 3px solid #e4dcc8; border-top-color: var(--vermillion);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back-link { display:inline-block; font-size:0.85rem; color:var(--indigo-light); cursor:pointer; margin-bottom:10px; }
  .back-link:hover { text-decoration: underline; }
  .kw-chip {
    display:inline-block; background:#eef2f7; color:var(--indigo);
    padding:3px 10px; border-radius:999px; font-size:0.78rem; margin:2px 4px 2px 0;
  }
  .kigo-description { font-size: 0.82rem; color: #6b7280; margin: 4px 0 0; line-height: 1.5; }

  .saijiki-panel {
    background: #eef7ee; border: 1px solid #cfe3cf; border-radius: 12px;
    padding: 14px 16px; margin-top: 10px; max-height: 320px; overflow-y: auto;
  }
  .saijiki-head { font-family:'Shippori Mincho',serif; color:#2f6b3a; font-weight:700; margin-bottom:8px; font-size:0.95rem; }
  .saijiki-item { padding: 6px 0; border-top: 1px dashed #cfe3cf; }
  .saijiki-item:first-of-type { border-top: none; }
  .saijiki-word { font-family:'Shippori Mincho',serif; font-weight:700; color:#2f6b3a; margin-right:8px; }
  .saijiki-desc { font-size:0.8rem; color:#4a5c4a; }
  footer.foot { text-align:center; font-size:0.75rem; color:#9aa0a6; margin-top: 30px; }
</style>
</head>

// Claude sometimes emits a raw newline/tab inside a JSON string value (e.g. the haiku's
// line breaks) instead of the escaped \n. That's invalid JSON, so JSON.parse rejects it.
// This walks the string tracking whether we're inside a quoted value and escapes any
// stray control characters found there before parsing.
function escapeStrayControlChars(str) {
  let result = '';
  let inString = false;
  let escaped = false;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (inString) {
      if (escaped) { result += ch; escaped = false; continue; }
      if (ch === '\\') { result += ch; escaped = true; continue; }
      if (ch === '"') { result += ch; inString = false; continue; }
      if (ch === '\n') { result += '\\n'; continue; }
      if (ch === '\r') { continue; }
      if (ch === '\t') { result += '\\t'; continue; }
      result += ch;
    } else {
      if (ch === '"') inString = true;
      result += ch;
    }
  }
  return result;
}

function extractJSON(text) {
  let cleaned = (text || '').trim();
  cleaned = cleaned.replace(/^```(json)?/i, '').replace(/```$/, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) {
    const err = new Error('AIの応答を解析できませんでした。もう一度お試しください。');
    err.isParseError = true;
    throw err;
  }
  const jsonStr = cleaned.slice(start, end + 1);
  try {
    return JSON.parse(jsonStr);
  } catch (e) {
    try {
      return JSON.parse(escapeStrayControlChars(jsonStr));
    } catch (e2) {
      const err = new Error('AIの応答を解析できませんでした。もう一度お試しください。');
      err.isParseError = true;
      throw err;
    }
  }
}

async function callClaudeOnce(system, userText, maxTokens) {
  if (!state.apiKey) {
    throw new Error('先に設定欄でAnthropic APIキーを入力してください。');
  }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: state.model,
      max_tokens: maxTokens,
      system,
      messages: [{ role: 'user', content: userText }],
    }),
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.json()).error?.message || ''; } catch (e) {}
    throw new Error(`APIエラー (${res.status}) ${detail}`);
  }
  const data = await res.json();
  const text = (data.content || []).map(c => c.text || '').join('');
  return extractJSON(text);
}

// The model occasionally returns malformed/truncated JSON. Since the request is cheap
// and fast, one silent retry resolves most of these without bothering the user.
async function callClaude(system, userText, maxTokens = 500) {
  try {
    return await callClaudeOnce(system, userText, maxTokens);
  } catch (e) {
    if (!e.isParseError) throw e;
    return await callClaudeOnce(system, userText, maxTokens);
  }
}

function drawCard() {
  let pool = CARD_DECK.map((c, i) => i).filter(i => !state.usedCardIndices.includes(i));
  if (pool.length === 0) { state.usedCardIndices = []; pool = CARD_DECK.map((c, i) => i); }
  const idx = pool[Math.floor(Math.random() * pool.length)];
  state.usedCardIndices.push(idx);
  return CARD_DECK[idx];
}

function escapeHtml(str) {
  return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function lastEntry() { return state.history[state.history.length - 1]; }

function scoreColorClass(delta) {
  if (delta > 0.001) return 'up';
  if (delta < -0.001) return 'down';
  return 'flat';
}

    state.hintLoading = true; state.error=''; render();
    try {

  async generateFromKeywords() {
    if (!state.keywords.trim()) { state.error = 'キーワードを入力してください。'; render(); return; }

    try {
      const gen = await callClaude(GEN_SYSTEM, `キーワード: ${state.keywords.trim()}`);

      state.history = [{
        label: 'AI作の俳句',
        text: gen.haiku,
        score: scored.score,
        goodPoint: scored.goodPoint,
        improvement: scored.improvement,
        note: gen.note,
        kigo: scored.kigo || gen.kigo,
        kigoDescription: scored.kigoDescription,
        season: scored.season,
      }];
      state.usedCardIndices = [];
      state.currentCard = null;
      state.showSaijiki = false;
      state.screen = 'result';
    } catch (e) {
      state.error = e.message;
    } finally {
      state.loading = false; render();

      state.loading = false; render();

    render();

  async scoreBrushup() {
    if (!state.brushDraft.trim()) { state.error = 'ブラッシュアップ後の俳句を入力してください。'; render(); return; }
    state.loading = true; state.error = ''; render();
    try {
      const scored = await callClaude(SCORE_SYSTEM, state.brushDraft.trim());
      const prevScore = lastEntry().score;
      state.history.push({
        label: `ブラッシュアップ ${state.history.length}回目`,
        text: state.brushDraft.trim(),
        score: scored.score,
        goodPoint: scored.goodPoint,
        improvement: scored.improvement,
        cardUsed: state.currentCard,
        delta: +(scored.score - prevScore).toFixed(1),
        kigo: scored.kigo,
        kigoDescription: scored.kigoDescription,
        season: scored.season,
      });
      state.currentCard = null;
      state.brushDraft = '';
      state.showSaijiki = false;
    } catch (e) {
      state.error = e.message;
    } finally {
      state.loading = false; render();
    }
  },

  restart() {
    state.screen = 'home';
    state.keywords = '';
    state.hintData = null;
    state.userDraft = '';
    state.history = [];
    state.usedCardIndices = [];
    state.currentCard = null;
    state.brushDraft = '';
    state.showSaijiki = false;

  <div class="panel">
    ${state.hintLoading ? renderLoading('AIがヒントを考えています...') : (h ? `
      <div class="hint-box">
        <div class="row-item"><b>季語の候補:</b> ${escapeHtml(h.kigo || '')}</div>
        <div class="row-item"><b>テーマ:</b> ${escapeHtml(h.theme || '')}</div>
        <div class="row-item"><b>情景のヒント:</b> ${escapeHtml(h.sceneHint || '')}</div>
        <div class="row-item"><b>作句のコツ:</b> ${escapeHtml(h.techniqueTip || '')}</div>
      </div>
      <button class="btn btn-ghost" style="margin-bottom:14px;" ${state.hintLoading?'disabled':''} onclick="Actions.fetchHint()">🔄 別のヒントをもらう</button>
    ` : '')}
    <label class="field-label">あなたの俳句（五七五で詠んでみましょう）</label>
    <textarea rows="3" placeholder="例: 桜舞う&#10;誰も知らない&#10;駅のベンチ" oninput="Actions.setDraft(this.value)">${escapeHtml(state.userDraft)}</textarea>
    <div style="height:12px;"></div>
    <button class="btn btn-primary btn-block" ${state.loading?'disabled':''} onclick="Actions.scoreUserDraft()">
      ${state.loading ? '採点しています...' : '📝 俳句を採点する'}
    </button>
  </div>
  ${state.loading ? renderLoading('AIが採点しています...') : ''}
  `;
}

function renderLoading(msg) {
  return `<div class="loading"><div class="spinner"></div>${escapeHtml(msg)}</div>`;
}

function renderChoitashiLogo() {
  return `
  <div class="choitashi-logo">
    <div class="ct-word ct-main">ちょいたし</div>
    <div class="ct-line2">
      <span class="ct-doodles">🐱🐤</span>
      <span class="ct-word ct-sub">カード</span>
    </div>
    <div class="ct-credit">2026.07.18　制作：多ぁ望＋くるすてぃーぬ</div>
    <a class="ct-list-link" href="cards.html" target="_blank" rel="noopener">📖 カード一覧を見る（全${CARD_DECK.length}枚）</a>
  </div>`;
}

function renderSaijikiPanel(season) {
  const words = SAIJIKI[season] || [];
  if (words.length === 0) return '';
  const items = words.map(w => `
    <div class="saijiki-item">
      <span class="saijiki-word">${escapeHtml(w.word)}</span>
      <span class="saijiki-desc">${escapeHtml(w.desc)}</span>
    </div>
  `).join('');
  return `
  <div class="saijiki-panel">
    <div class="saijiki-head">🍀 ${escapeHtml(season)}の季語一覧</div>
    ${items}
  </div>`;
}

function renderScoreBlock(entry) {
  const pct = Math.max(0, Math.min(100, (entry.score / 10) * 100));
  return `
    <div class="haiku-display">${escapeHtml(entry.text)}</div>
    <div class="score-wrap">
      <div class="score-num">${entry.score}<small>/10</small></div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="comment-row"><span class="tag good">良い点</span><span>${escapeHtml(entry.goodPoint || '')}</span></div>
    <div class="comment-row"><span class="tag tip">ヒント</span><span>${escapeHtml(entry.improvement || '')}</span></div>
    ${entry.kigo ? `
    <div style="margin-top:8px;"><span class="kw-chip">季語: ${escapeHtml(entry.kigo)}</span></div>
    ${entry.kigoDescription ? `<p class="kigo-description">${escapeHtml(entry.kigoDescription)}</p>` : ''}
    ` : ''}
  `;
}

function renderResult() {
  const latest = lastEntry();
  if (!latest) return renderHome();

  let cardSection = '';
  if (state.currentCard) {
    cardSection = `
    <div class="card-draw">
      <div class="icon">${state.currentCard.icon}</div>
      <h4>🌸 ちょいたしカード:「${escapeHtml(state.currentCard.title)}」</h4>
      <p>${escapeHtml(state.currentCard.tip)}</p>
      <button class="btn btn-ghost" style="margin-top:12px; background:#fffdf8;" ${state.loading?'disabled':''} onclick="Actions.swapCard()">🔄 カード交換</button>
    </div>
    <label class="field-label">この俳句をブラッシュアップしてみましょう</label>
    <textarea rows="3" oninput="Actions.setBrushDraft(this.value)">${escapeHtml(state.brushDraft)}</textarea>
    <div style="height:10px;"></div>
    <div class="row">
      <button class="btn btn-accent" ${state.loading?'disabled':''} onclick="Actions.scoreBrushup()">
        ${state.loading ? '採点しています...' : '✨ ブラッシュアップ後を採点する'}
      </button>
      <button class="btn btn-ghost" ${state.loading?'disabled':''} onclick="Actions.cancelBrush()">やめる</button>
    </div>
    ${state.loading ? renderLoading('AIが採点しています...') : ''}
    `;
  } else {
    const season = latest.season;
    cardSection = `
    ${renderChoitashiLogo()}
    <div class="row">
      <button class="btn btn-accent" ${state.loading?'disabled':''} onclick="Actions.drawTipCard()">
        🌸 ちょいたしカードを引いてブラッシュアップする
      </button>
      ${season ? `
      <button class="btn btn-ghost" ${state.loading?'disabled':''} onclick="Actions.toggleSaijiki()">
        🍀 ${escapeHtml(season)}の季語一覧を見る
      </button>` : ''}
    </div>
    ${season && state.showSaijiki ? renderSaijikiPanel(season) : ''}
    `;
  }

  const historyRows = state.history.slice().reverse().map((entry, revIdx) => {
    const idx = state.history.length - 1 - revIdx;
    if (idx === state.history.length - 1) return '';
    const deltaTxt = entry.delta === undefined ? '' :
      `<span class="delta ${scoreColorClass(entry.delta)}">${entry.delta > 0 ? '▲+' + entry.delta : (entry.delta < 0 ? '▼' + entry.delta : '→±0')}</span>`;
    return `
    <div class="history-item">
      <div class="history-head">
        <span>${escapeHtml(entry.label)}${entry.cardUsed ? ` （${entry.cardUsed.icon} ${escapeHtml(entry.cardUsed.title)}）` : ''}</span>
        <span>${entry.score}/10 ${deltaTxt}</span>
      </div>
      <div class="history-haiku">${escapeHtml(entry.text)}</div>
    </div>`;
  }).join('');

  return `
  <span class="back-link" onclick="Actions.goHome()">← モード選択に戻る</span>
  <div class="panel">
    <div class="history-head" style="margin-bottom:6px;">
      <span><b>${escapeHtml(latest.label)}</b>${latest.cardUsed ? ` （${latest.cardUsed.icon} ${escapeHtml(latest.cardUsed.title)}を反映）` : ''}</span>
      ${latest.delta !== undefined ? `<span class="delta ${scoreColorClass(latest.delta)}">${latest.delta > 0 ? '▲+' + latest.delta : (latest.delta < 0 ? '▼' + latest.delta : '→±0')} （前回比）</span>` : ''}
    </div>
    ${renderScoreBlock(latest)}
  </div>
  <div class="panel">
    ${cardSection}
  </div>
  ${state.history.length > 1 ? `
  <div class="panel">
    <div style="font-weight:700; font-size:0.9rem; color:var(--indigo); margin-bottom:6px;">これまでの推移</div>
    ${historyRows}
    <div class="history-head" style="margin-top:8px; padding-top:8px; border-top:1px dashed #d8cfb8;">
      <span>合計の伸び（最初 → 最新）</span>
      <span class="delta ${scoreColorClass(latest.score - state.history[0].score)}">
        ${(latest.score - state.history[0].score) > 0 ? '▲+' : (latest.score - state.history[0].score) < 0 ? '▼' : '→'}${Math.abs(+(latest.score - state.history[0].score).toFixed(1))}
      </span>
    </div>
  </div>` : ''}
  <button class="btn btn-ghost btn-block" onclick="Actions.restart()">🔁 最初からやり直す</button>
  `;
}

function render() {
  let body = '';
  if (state.screen === 'home') body = renderHome();
  else if (state.screen === 'keyword') body = renderKeyword();
  else if (state.screen === 'hint') body = renderHint();
  else if (state.screen === 'result') body = renderResult();

  document.getElementById('app').innerHTML = `
    <header class="top">
      <h1>俳句道場</h1>
      <p>AIと詠み、AIが採点し、ちょいたしカードで磨き上げる一句</p>
    </header>
    ${renderSettings()}
    ${renderError()}
    ${body}
    <footer class="foot">五七五の心で、今日の一句を。</footer>
  `;
}

render();
</script>
</body>
</html>
